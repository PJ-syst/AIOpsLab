# kind cluster for power-aware fault testing.
#
# Load shedding and pod-rescheduling scenarios need more than one worker:
# stopping the only worker of kind-config-x86.yaml takes the whole app down
# with no rescheduling possible. This config gives 3 workers so shedding one
# node still leaves capacity for the scheduler.
#
# Usage:
#   kind create cluster --config kind/kind-config-power.yaml --wait 120s
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    image: jacksonarthurclark/aiopslab-kind-x86:latest
    extraMounts:
      - hostPath: /run/udev
        containerPath: /run/udev
  - role: worker
    image: jacksonarthurclark/aiopslab-kind-x86:latest
    extraMounts:
      - hostPath: /run/udev
        containerPath: /run/udev
  - role: worker
    image: jacksonarthurclark/aiopslab-kind-x86:latest
    extraMounts:
      - hostPath: /run/udev
        containerPath: /run/udev
  - role: worker
    image: jacksonarthurclark/aiopslab-kind-x86:latest
    extraMounts:
      - hostPath: /run/udev
        containerPath: /run/udev
